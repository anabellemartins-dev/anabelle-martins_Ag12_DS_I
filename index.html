<!DOCTYPE html>
<!-- Página web: Meus sites favoritos -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>
    <!-- Estilo simples para deixar a página mais organizada -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; }
        .site { background-color: white; width: 320px; margin: 20px auto; padding: 15px; border-radius: 12px; }
        img { width: 96px; height: 96px; }
    </style>
</head>
<body>
    <!-- Título do corpo da página, com o meu nome -->
    <h1>Meus sites favoritos: Anabelle Martins</h1>

    <!-- SITE 1: Canva -->
    <div class="site">
        <!-- Nome do site (acima da imagem) -->
        <h1>Canva</h1>
        <!-- Imagem do site, com link (opcional) -->
        <a href="https://www.canva.com" target="_blank"><img src="https://www.google.com/s2/favicons?domain=canva.com&sz=128" alt="Logo do Canva"></a>
        <!-- Link para o site (abaixo da imagem) -->
        <p><a href="https://www.canva.com" target="_blank">www.canva.com</a></p>
    </div>

    <!-- SITE 2: Figma -->
    <div class="site">
        <h1>Figma</h1>
        <a href="https://www.figma.com" target="_blank"><img src="https://www.google.com/s2/favicons?domain=figma.com&sz=128" alt="Logo do Figma"></a>
        <p><a href="https://www.figma.com" target="_blank">www.figma.com</a></p>
    </div>

    <!-- SITE 3: GitHub -->
    <div class="site">
        <h1>GitHub</h1>
        <a href="https://github.com" target="_blank"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=128" alt="Logo do GitHub"></a>
        <p><a href="https://github.com" target="_blank">github.com</a></p>
    </div>

    <!-- SITE 4: YouTube -->
    <div class="site">
        <h1>YouTube</h1>
        <a href="https://www.youtube.com" target="_blank"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="Logo do YouTube"></a>
        <p><a href="https://www.youtube.com" target="_blank">www.youtube.com</a></p>
    </div>

    <!-- SITE 5: Spotify -->
    <div class="site">
        <h1>Spotify</h1>
        <a href="https://www.spotify.com" target="_blank"><img src="https://www.google.com/s2/favicons?domain=spotify.com&sz=128" alt="Logo do Spotify"></a>
        <p><a href="https://www.spotify.com" target="_blank">www.spotify.com</a></p>
    </div>
</body>
</html>
